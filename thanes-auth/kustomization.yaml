# What Argo CD syncs (argocd/application.yaml points here).
#
# Deliberately left out:
#   - secrets.example.yaml   template only; the real Secrets are created out of band
#   - import-legacy-job.yaml one-off Job, applied by hand during cutover
#   - argocd/                the Application itself
#
# The image tag in deploy-v2.yaml, purge-cronjob.yaml and import-legacy-job.yaml is
# rewritten by the auth repository's CI (.github/workflows/main.yaml, a plain sed on
# "image:" lines), so do not move it into a kustomize "images:" block.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: smtrack
labels:
  - pairs:
      app.kubernetes.io/part-of: smtrack
    includeSelectors: false
resources:
  - configmap.yaml
  - deploy-v2.yaml
  - purge-cronjob.yaml

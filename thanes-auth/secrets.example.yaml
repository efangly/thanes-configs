# TEMPLATE ONLY. Never commit real values, and never add this file to kustomization.yaml.
# Create the Secret out of band, e.g.:
#
#   kubectl -n smtrack create secret generic authentication-v2-secrets \
#     --from-literal=DATABASE_URL='postgresql://auth_v2:...@postgres:5432/smtrack_auth_v2?sslmode=require' \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=JWT_REFRESH_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=REDIS_PASSWORD='...' \
#     --from-literal=S3_ACCESS_KEY='...' \
#     --from-literal=S3_SECRET_KEY='...' \
#     --from-literal=IMAGE_ENCRYPTION_KEY="$(openssl rand -base64 32)"
#
# Rules the service enforces at startup: both JWT secrets at least 32 characters and
# different from each other. Changing either signs everybody out. Losing
# IMAGE_ENCRYPTION_KEY makes every stored picture unreadable: keep a copy in the secret store.
# Restrict who can read this Secret (docs/security/iso27001-controls.md in the auth repo).
apiVersion: v1
kind: Secret
metadata:
  name: authentication-v2-secrets
  namespace: smtrack
type: Opaque
stringData:
  DATABASE_URL: "postgresql://USER:PASSWORD@HOST:5432/DB?sslmode=require"
  JWT_SECRET: "CHANGE-ME-at-least-32-characters-long"
  JWT_REFRESH_SECRET: "CHANGE-ME-different-and-at-least-32-chars"
  REDIS_PASSWORD: ""
  S3_ACCESS_KEY: "CHANGE-ME"
  S3_SECRET_KEY: "CHANGE-ME"
  IMAGE_ENCRYPTION_KEY: "CHANGE-ME-openssl-rand-base64-32"

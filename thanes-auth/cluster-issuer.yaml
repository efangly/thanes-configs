# Let's Encrypt (production) issuer for the thanes-auth Ingress, solved over HTTP-01
# through the nginx ingress controller. api.siamatic.work must resolve to the cluster
# and port 80 must be reachable from the internet, also for renewals.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: thanes-auth-issuer
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: fanglyhome@gmail.com
    privateKeySecretRef:
      name: thanes-auth-issuer-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx

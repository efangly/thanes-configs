# One-off copy of the old system's metadata (devices, probes, configs, repairs,
# warranties) into v2 (ADR-0007). LogDays are not included; see
# scripts/migrate-legacy/README.md in the backend repository.
# NOT synced by Argo CD (not in kustomization.yaml): apply it by hand.
#
# Order: set up the legacy sync queue (npm run legacy-sync:setup, from a checkout of the
# backend repository) -> run this Job -> set LEGACY_SYNC_ENABLED to "true" in configmap.yaml.
# Safe to re-run (last write wins on updateAt).
#
# Needs the Secret smtrack-v2-backend-legacy-db. Set the image tag below to the one in
# kustomization.yaml (CI does not rewrite it).
#   kubectl -n smtrack delete job smtrack-v2-backend-legacy-backfill --ignore-not-found
#   kubectl -n smtrack apply -f legacy-backfill-job.yaml
#   kubectl -n smtrack logs -f job/smtrack-v2-backend-legacy-backfill
apiVersion: batch/v1
kind: Job
metadata:
  name: smtrack-v2-backend-legacy-backfill
  namespace: smtrack
  labels:
    app.kubernetes.io/name: smtrack-v2-backend
    app.kubernetes.io/component: legacy-backfill
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smtrack-v2-backend
        app.kubernetes.io/component: legacy-backfill
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: legacy-backfill
          image: docker.io/siamatic/smtrack-backend:test
          imagePullPolicy: Always
          command: ["node", "dist/cli/legacy-backfill"]
          envFrom:
            - configMapRef:
                name: smtrack-v2-backend-config
            - secretRef:
                name: smtrack-v2-backend-secrets
          env:
            - name: SOURCE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: smtrack-v2-backend-legacy-db
                  key: SOURCE_DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

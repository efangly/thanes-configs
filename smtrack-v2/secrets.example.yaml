# TEMPLATE ONLY. Never commit real values, and never add this file to kustomization.yaml.
# Copy each document into secrets/ (ignored by Git), fill it in, and kubectl apply it.
# URL-encode @ : / ? # inside passwords in the *_URL values.
# The second Secret is only needed for legacy sync (backfill and reconcile).
apiVersion: v1
kind: Secret
metadata:
  name: smtrack-v2-backend-secrets
  namespace: smtrack
  labels:
    app.kubernetes.io/name: smtrack-v2-backend
type: Opaque
stringData:
  # PostgreSQL with the TimescaleDB extension.
  DATABASE_URL: "postgresql://USER:CHANGE-ME@HOST:5432/DB"
  REDIS_URL: "redis://USER:CHANGE-ME@HOST:6379"
  RABBITMQ_URL: "amqp://USER:CHANGE-ME@HOST:5672"
  MQTT_USERNAME: "CHANGE-ME"
  MQTT_PASSWORD: "CHANGE-ME"
  # Must equal the JWT_SECRET of the auth service that issues the users' tokens.
  JWT_SECRET: "CHANGE-ME"
  # Must equal the secret the device tokens are signed with.
  DEVICE_SECRET: "CHANGE-ME"
  ARCHIVE_S3_ACCESS_KEY: "CHANGE-ME"
  ARCHIVE_S3_SECRET_KEY: "CHANGE-ME"
  # Delete the DEVICE_ / FIRMWARE_ pairs to reuse the ARCHIVE_ keys.
  DEVICE_S3_ACCESS_KEY: "CHANGE-ME"
  DEVICE_S3_SECRET_KEY: "CHANGE-ME"
  FIRMWARE_S3_ACCESS_KEY: "CHANGE-ME"
  FIRMWARE_S3_SECRET_KEY: "CHANGE-ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: smtrack-v2-backend-legacy-db
  namespace: smtrack
  labels:
    app.kubernetes.io/name: smtrack-v2-backend
type: Opaque
stringData:
  # Old smtrack-device database. Use a read-only role.
  SOURCE_DATABASE_URL: "postgresql://READONLY:CHANGE-ME@HOST:5432/smtrack_device"
  # Only if the old logs are in a separate database; otherwise delete this line.
  SOURCE_LOG_DATABASE_URL: "postgresql://READONLY:CHANGE-ME@HOST:5432/smtrack_log"

# Argo CD Application for the SMtrack v2 backend. Apply once by hand:
#   kubectl apply -n argocd -f argocd/application.yaml
# After that Argo CD keeps the cluster in line with smtrack-v2/kustomization.yaml.
#
# Secrets are not in Git and are never touched (or pruned) by Argo CD.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smtrack-v2-backend
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: smtrack
  # Removing the Application also removes what it deployed.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/efangly/thanes-configs.git
    targetRevision: main
    path: smtrack-v2
  destination:
    server: https://kubernetes.default.svc
    namespace: smtrack
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  # Lets the legacy reconcile CronJob be enabled with kubectl patch.
  ignoreDifferences:
    - group: batch
      kind: CronJob
      name: smtrack-v2-backend-legacy-reconcile
      jsonPointers:
        - /spec/suspend
  revisionHistoryLimit: 10
